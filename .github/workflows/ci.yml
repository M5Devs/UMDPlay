name: CI Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-linux:
    name: Linux GCC Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies, FFmpeg & SDL2
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake build-essential pkg-config \
                                  libavformat-dev libavcodec-dev libavutil-dev \
                                  libswscale-dev libswresample-dev libavfilter-dev \
                                  libsdl2-dev xvfb fonts-noto-cjk

      - name: Configure CMake
        # Treat project warnings as errors so CI enforces the zero-warning bar.
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="-Werror"

      - name: Build UMDPlay Executable
        run: cmake --build build --config Release -j"$(nproc)"

      - name: Run Tests
        working-directory: build
        run: ctest --output-on-failure

      - name: Verify Binary (Headless)
        run: |
          ls -lh build/bin/umdplay
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy ./build/bin/umdplay || true

      - name: Verify 10-foot UI Renders (Xvfb)
        # --demo renders the hub with synthetic data (no copyrighted assets),
        # so this catches UI/ImGui regressions on every run. Each strip is
        # rendered to prove the whole shell lays out headlessly.
        run: |
          for strip in recent browse settings; do
            xvfb-run -a -s "-screen 0 1280x720x24" \
              ./build/bin/umdplay --demo --strip "$strip" \
                                  --screenshot "/tmp/wmc_ui_${strip}.png"
            test -s "/tmp/wmc_ui_${strip}.png"
            ls -lh "/tmp/wmc_ui_${strip}.png"
          done

      - name: Verify Player OSD Renders (Xvfb)
        # --demo-player draws the transport OSD over a synthetic video texture
        # (no ISO needed), proving the player chrome lays out headlessly.
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" \
            ./build/bin/umdplay --demo-player --screenshot /tmp/player_osd.png
          test -s /tmp/player_osd.png
          ls -lh /tmp/player_osd.png

      - name: Upload UI Screenshots
        uses: actions/upload-artifact@v4
        with:
          name: wmc-ui-preview
          path: |
            /tmp/wmc_ui_*.png
            /tmp/player_osd.png

  build-macos:
    name: macOS (${{ matrix.arch }}) Build
    # macos-latest is Apple Silicon (arm64); macos-15-intel is the x86_64
    # runner. Both are exercised so the macOS build stays clean on either arch.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      # Homebrew hardening for CI: never self-update (a `brew update` can pull
      # formula versions with no bottle and force a from-source build — the
      # ~90-minute failure mode), and skip the post-install cleanup and
      # dependent-rebuild passes. With these set, the bottled cmake/ffmpeg/sdl2
      # install in seconds.
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache Homebrew downloads
        # Cache the bottle download cache (ffmpeg drags in ~1 GB of deps) so
        # repeat runs skip re-fetching. It is content-addressed, so a stale entry
        # is harmless: brew re-downloads only what actually changed.
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: brew-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            brew-${{ runner.os }}-${{ matrix.arch }}-

      - name: Install Build Dependencies, FFmpeg & SDL2
        # Install bottles (prebuilt) only; no `brew update`, so we stay on the
        # bottled versions that match the runner image.
        run: brew install cmake pkg-config ffmpeg sdl2

      - name: Configure CMake
        # Treat project warnings as errors so CI enforces the zero-warning bar
        # (matches the Linux and Windows jobs).
        run: |
          export PKG_CONFIG_PATH="$(brew --prefix)/opt/ffmpeg/lib/pkgconfig:$(brew --prefix)/opt/sdl2/lib/pkgconfig"
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DUMDPLAY_WERROR=ON

      - name: Build UMDPlay Executable
        run: cmake --build build --config Release -j"$(sysctl -n hw.ncpu)"

      - name: Run Tests
        working-directory: build
        run: ctest --output-on-failure

      - name: Verify Binary & UI Render (Headless)
        # The SDL "dummy" driver renders to an off-screen surface, so the demo
        # strips can be screenshotted without a window server (no Xvfb here).
        # --demo/--demo-player use synthetic data, so no copyrighted assets are
        # needed; this catches UI/ImGui regressions on macOS on every run.
        run: |
          ls -lh build/bin/umdplay
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy ./build/bin/umdplay || true
          for strip in recent browse settings; do
            SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy \
              ./build/bin/umdplay --demo --strip "$strip" \
                                  --screenshot "/tmp/wmc_ui_${strip}.png"
            test -s "/tmp/wmc_ui_${strip}.png"
            ls -lh "/tmp/wmc_ui_${strip}.png"
          done
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy \
            ./build/bin/umdplay --demo-player --screenshot /tmp/player_osd.png
          test -s /tmp/player_osd.png
          ls -lh /tmp/player_osd.png

      - name: Upload UI Screenshots
        uses: actions/upload-artifact@v4
        with:
          name: macos-ui-preview-${{ matrix.arch }}
          path: |
            /tmp/wmc_ui_*.png
            /tmp/player_osd.png
